# DataLens configuration. Every experiment must record the values it used.

project:
  name: DataLens
  random_seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures
  tables_dir: reports/tables
  experiments_dir: experiments
  models_dir: models_store

ingestion:
  # CIC-IDS2017 "MachineLearningCVE" CSVs (one file per capture day).
  file_glob: "*.csv"
  encoding: "utf-8"
  fallback_encodings: ["cp1252", "latin-1"]   # latin-1 must be LAST (it never fails to decode)
  chunk_size: 200000          # rows per chunk for large-file processing
  # Development sampling. null = use ALL rows. Any value other than null must be
  # recorded in every result so a sample is never presented as the full dataset.
  sample_fraction: null
  label_column: "Label"
  source_column: "source_file"    # added by the loader; identifies the capture day/file
  compute_hash: true              # sha256 of raw files for the dataset fingerprint

profiling:
  near_constant_threshold: 0.99   # top value share above this => near-constant
  high_cardinality_ratio: 0.5     # unique/rows above this => high-cardinality
  outlier_iqr_factor: 1.5         # flag only; never auto-remove

quality:
  # Column-name keywords that imply a non-negative quantity. Negative values in
  # such columns are reported as SUSPICIOUS (some are legitimate sentinels, e.g. -1).
  non_negative_keywords: ["duration", "packets", "bytes", "length", "iat", "count"]
  # Column-name keywords that suggest identifiers/timestamps (leakage risk).
  identifier_keywords: ["id", "ip", "timestamp", "time", "port"]
  min_class_samples: 10           # classes below this break stratified splits / CV
  imbalance_ratio_warn: 10        # majority/minority count ratio
  imbalance_ratio_high: 100
  missing_pct_high: 5.0           # percent of rows
  duplicate_pct_warn: 1.0         # percent of rows

split:
  # Retained for compatibility with the Phase 1/2 configuration.
  strategy: stratified
  test_size: 0.2
  cv_folds: 5
  random:                         # Stratified random split (same-capture evaluation)
    rare_class_policy: train_only
    min_class_count: 2
    min_test_per_class: 5
  day_aware:                      # Hold out complete capture days
    groups:
      monday: [monday]
      tuesday: [tuesday]
      wednesday: [wednesday]
      thursday: [thursday]
      friday: [friday]
    primary_holdout: [friday]

preprocessing:
  numeric:
    inf_strategy: nan             # nan | clip. inf is "undefined", never silently 0
    imputer: median               # median | mean | most_frequent (fitted on training rows only)
    missing_indicator: true       # keep the fact that a value was inf/NaN as extra 0/1 columns
    scaler: robust                # standard | robust | minmax | none. Trees do not need scaling
  categorical:
    imputer: most_frequent
    handle_unknown: ignore
    min_frequency: null
  duplicates:
    # keep | drop_exact | drop_conflicts | drop_exact_and_conflicts
    # drop_exact is the default: exact duplicates split across train/test inflate test scores.
    # Conflicting vectors are KEPT by default: they are real irreducible label noise.
    policy: drop_exact
    max_class_loss_pct: 50.0      # warn when a class loses at least this share of its rows
  fit_max_rows: 500000            # preprocessor statistics fitted on <= this many TRAIN rows (null = all)
  transform_chunk_size: 200000

features:
  exclude_zero_variance: true     # drops ONLY features constant on the training rows (logged with evidence)
  variance_threshold: 1.0e-8
  correlation_threshold: 0.95
  correlation_method: pearson
  analysis_max_rows: 200000       # training rows sampled for correlation analysis
  probe:                          # single-feature shortcut probe (flags for review, never removes)
    enabled: true
    max_rows: 100000
    cv: 3
    max_depth: 3
    flag_auc: 0.99
  importance:                     # train-only impurity importance (preparation for Phase 5)
    enabled: true
    n_estimators: 100
    max_depth: 12
    max_rows: 200000
  selection:
    method: none                  # none | variance | kbest_f | kbest_mi | model_rf (compared in Phase 4/5 with CV)
    k: 30

imbalance:
  minority_pct: 1.0
  min_test_per_class: 5
  low_support_test: 30
  smote_k: 5

logging:
  level: INFO
